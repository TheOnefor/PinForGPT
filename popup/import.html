<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinForGPT — Import</title>
  <link rel="stylesheet" href="import.css">
</head>
<body>
  <main class="import-app">
    <header class="header">
      <span class="brand">★ PinForGPT</span>
      <span class="version" id="version"></span>
    </header>
    <h1 id="title"></h1>
    <p class="intro" id="description"></p>

    <div class="dropzone" id="dropzone">
      <div class="drop-icon" aria-hidden="true">⇪</div>
      <strong id="drop-title"></strong>
      <button type="button" id="choose" class="button outline"></button>
      <input id="file-input" type="file" accept=".json,application/json" hidden>
    </div>

    <section id="selection" class="selection" hidden>
      <p id="filename" class="filename"></p>
      <p id="summary" class="summary"></p>
      <fieldset class="modes">
        <label><input type="radio" name="mode" value="merge" checked><span id="merge-label"></span></label>
        <label><input type="radio" name="mode" value="replace"><span id="replace-label"></span></label>
      </fieldset>
      <p id="replace-warning" class="warning" hidden></p>
      <button type="button" id="submit" class="button primary"></button>
    </section>

    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    <p id="success-note" class="success-note" hidden></p>
    <button id="again" type="button" class="button outline" hidden></button>
  </main>
  <script src="../ui/i18n.js"></script>
  <script src="../core/backup.js"></script>
  <script src="import.js"></script>
</body>
</html>
