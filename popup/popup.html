<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinForGPT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span id="brand-icon" class="brand-icon" aria-hidden="true"></span>
        <strong>PinForGPT</strong>
      </div>
      <span class="version" id="version"></span>
    </header>

    <nav class="tabs" role="tablist" aria-label="PinForGPT">
      <button type="button" id="tab-favorites" class="tab is-active" role="tab" aria-selected="true" aria-controls="panel-favorites" data-tab="favorites"></button>
      <button type="button" id="tab-backups" class="tab" role="tab" aria-selected="false" aria-controls="panel-backups" data-tab="backups"></button>
      <button type="button" id="tab-icons" class="tab" role="tab" aria-selected="false" aria-controls="panel-icons" data-tab="icons"></button>
    </nav>

    <main>
      <section id="panel-favorites" class="panel" role="tabpanel" aria-labelledby="tab-favorites">
        <div class="section-summary"><span id="unique-count"></span></div>
        <button type="button" id="add-current" class="primary-action" disabled></button>
        <p id="current-hint" class="hint"></p>
        <div class="chat-list" id="chat-list" aria-live="polite"></div>
      </section>
      <section id="panel-backups" class="panel" role="tabpanel" aria-labelledby="tab-backups" hidden>
        <div class="backup-tools">
          <h2 id="backup-title"></h2>
          <p id="backup-explanation" class="backup-description"></p>
          <button type="button" id="export-backup" class="primary-action"></button>
          <p id="export-hint" class="backup-hint"></p>
          <div class="backup-rule"></div>
          <h3 id="import-heading"></h3>
          <p id="import-pending" class="backup-description"></p>
          <button type="button" id="import-backup" class="primary-action"></button>
        </div>
      </section>
      <section id="panel-icons" class="panel" role="tabpanel" aria-labelledby="tab-icons" hidden>
        <div class="icon-workspace">
          <div class="icon-catalog-group icon-icons-group">
            <h2 id="icon-icons-heading"></h2>
            <div class="icon-choices-scroll" id="icon-icons-list" role="group" aria-labelledby="icon-icons-heading"></div>
          </div>
          <div class="icon-catalog-group icon-colors-group">
            <h2 id="icon-colors-heading"></h2>
            <div class="icon-choices-scroll" id="icon-colors-list" role="group" aria-labelledby="icon-colors-heading"></div>
          </div>
          <div class="icon-editor">
            <div class="icon-editor-row">
              <div class="icon-editor-field">
                <label for="icon-code-input" id="icon-code-label"></label>
                <input type="text" id="icon-code-input" maxlength="1024" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="icon-code-error icon-code-help">
              </div>
              <div class="icon-editor-field icon-preview-field">
                <h2 id="icon-preview-heading"></h2>
                <div id="icon-preview-content" class="icon-preview-content" aria-live="polite"></div>
              </div>
            </div>
            <p class="icon-code-error" id="icon-code-error" role="alert" hidden></p>
            <p class="icon-code-help" id="icon-code-help"></p>
            <div class="icon-actions">
              <button type="button" id="icon-reset"></button>
              <button type="button" id="icon-copy" disabled></button>
            </div>
            <div class="icon-copy-status" id="icon-copy-status" role="status" aria-live="polite"></div>
            <div class="icon-license">Icons by Lucide Contributors · ISC/MIT · <a href="../third_party/lucide/LICENSE" target="_blank" rel="noopener noreferrer">License</a></div>
          </div>
        </div>
      </section>
    </main>

    <div class="status" id="status" role="status" aria-live="polite" hidden>
      <span class="status-text" id="status-text"></span>
      <button type="button" class="status-close" id="status-close" aria-label="Close notification">&times;</button>
    </div>
    <div class="row-menu" id="row-menu" role="menu" hidden>
      <button type="button" role="menuitem" id="menu-remove"></button>
    </div>
  </div>
  <script src="../ui/i18n.js"></script>
  <script src="../ui/icons.js"></script>
  <script src="../ui/title-icon-catalog.js"></script>
  <script src="../ui/title-code-syntax.js"></script>
  <script src="../ui/title-renderer.js"></script>
  <script src="../core/backup.js"></script>
  <script src="popup-view.js"></script>
  <script src="icons-tab.js"></script>
  <script src="popup.js"></script>
</body>
</html>
